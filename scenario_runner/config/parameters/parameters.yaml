# User-selected deployment and scenario behavior.
# Service networks, Docker hostnames, and required DNS aliases are
# generated by Scenario Runner and must not be configured here.

test_cases:
  - label: town10_two_vehicle_xil
    # Scenario Runner supports ROS 2 components only.
    runtime_seconds: 90

    env_settings:
      cdasim:
        PROJECT_NAME: cdasim
        CONFIG_IMAGE_FULL: usdotfhwastol/cdasim-config:carma-system-4.13.1-14-geb5b47f-basic-cdasim-config-image
        CONFIG_COMPOSE_PATH: /opt/carma-simulation/config/docker-compose.yml
        CONFIG_IMAGE_PULL_POLICY: missing
        COMPOSE_OVERRIDES: []
        settings:
          MOSAIC_SCENARIO: Town10
          CDASIM_IMAGE: usdotfhwastoldev/cdasim:develop
          CARLA_SENSOR_LIB_IMAGE: usdotfhwastol/carla-sensor-lib:carma-system-4.13.0

      carma_cloud:
        PROJECT_NAME: carma_cloud
        COMPOSE_FILE: ../../../../carma-cloud/docker-compose.yml
        WEB_XML_FILE: ../../../../carma-cloud/carma-cloud-config/web.xml
        COMPOSE_OVERRIDES: []
        INTERNAL_COMPOSE_OVERRIDES:
          - ../compose/carma-cloud.cdasim.yml
        settings:
          CARMA_CLOUD_IMAGE: usdotfhwastol/carma-cloud:carma-system-4.6.1

      vehicles:
        - PROJECT_NAME: platform_vehicle_1
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastol/carma-config:carma-system-4.13.0-SNAPSHOT-xil-Town10
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          settings:
            VEHICLE_ID: carma_1
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastoldev/carma-carla-integration:develop
            V2X_ROS_DRIVER_IMAGE: usdotfhwastol/v2x-ros-driver:carma-system-4.11.0
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastoldev/carma-ns3-adapter:develop
            SELECTED_ROUTE: Town10_loop_official
            START_DELAY_IN_SECONDS: 30
            SPAWN_POINT:
              x: 58.6
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0

        - PROJECT_NAME: platform_vehicle_2
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastol/carma-config:carma-system-4.13.0-SNAPSHOT-xil-Town10
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          settings:
            VEHICLE_ID: carma_2
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastoldev/carma-carla-integration:develop
            V2X_ROS_DRIVER_IMAGE: usdotfhwastol/v2x-ros-driver:carma-system-4.11.0
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastoldev/carma-ns3-adapter:develop
            SELECTED_ROUTE: Town10_loop_official
            START_DELAY_IN_SECONDS: 35
            SPAWN_POINT:
              x: 48.0
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0

      streets:
        - PROJECT_NAME: street_1
          COMPOSE_FILE: ../../../../carma-streets/docker-compose.yml
          COMPOSE_OVERRIDES:
            - ../../../../carma-streets/docker-compose.cdasim.yml
          settings:
            STOL_ORG: usdotfhwastoldev
            STOL_TAG: develop
            V2XHUB_VERSION: develop
            INFRASTRUCTURE_ID: rsu_1234
            INFRASTRUCTURE_NAME: East Intersection
            EVC:
              enable: false
              snmp_port: null
            SENSORS:
              enable: true
              sensor_id: lidar_north
              type: SemanticLidarSensor
            SPAWN_POSITION:
              x: 100.0
              y: 0.0
              z: 0.0
              yaw: 180.0

    data_output:
      output_directory: /opt/carma-simulation/tests/output/town10
      collect:
        mosaic_logs: /opt/carma-simulation/logs
        rosbags: /opt/carma/logs
        v2xhub_logs: /tmp/cdasim-scenario-runner
        carmacloud_logs: /opt/carma/logs/carmacloud
